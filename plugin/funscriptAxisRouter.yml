name: Funscript Axis Router
description: >-
  (Beta) Routes the axes of a multi-axis funscript (roll, pitch, surge, ...) to
  an XToys webhook. By default the Handy keeps playing the stroke axis, but any
  axis can be routed instead - see the Stroke Axis Owner setting.
version: 0.16.1
url: https://github.com/stashapp/stash

ui:
  javascript:
    - funscriptAxisRouter.js
  csp:
    connect-src:
      - wss://webhook.xtoys.app

settings:
  routeStrokeAxis:
    displayName: Route Stroke Axis Here
    description: >-
      Off (default), the Handy plays the stroke axis when a Handy key is
      configured, and this plugin routes it otherwise. On, this plugin always
      routes it, on the same clock as every other axis, and the Handy is not used
      at all. Turn this on if the Handy drifts out of phase with the other axes.
    type: BOOLEAN
  xtoysWebhookId:
    displayName: Webhook ID
    description: >-
      The Webhook ID from XToys, created under Private Webhooks at xtoys.app/me
      and shown on the Webhook block in your script. Connects to
      wss://webhook.xtoys.app/<id>. Leave blank to disable routing.
    type: STRING
  xtoysToken:
    displayName: Auth Token
    description: >-
      Only for a Shared Webhook, sent as ?token= on the websocket URL. Leave
      blank for a Private Webhook - it authenticates on the Webhook ID alone,
      and a stray token may get the connection rejected. On a good
      connection XToys replies with an acknowledgement, logged to the browser
      console; a warning appears there if none arrives.
    type: STRING
  includePayload:
    displayName: Include Payload Copy
    description: >-
      Repeat the channel map as one JSON string in a "payload" field. Off by
      default - it doubles the size of every message. Only turn it on if you
      built the XToys side out of blocks and triggers rather than JavaScript,
      where a trigger cannot read a channel whose name it only learns at runtime.
    type: BOOLEAN
  stopValue:
    displayName: Stop Value
    description: >-
      What to send to every channel when playback stops. Leave blank to hold the
      last values. Set to 0 to park vibrations, which is usually what you want if
      any channel drives a vibrator.
    type: NUMBER
  remoteControl:
    displayName: Allow Remote Control
    description: >-
      Let the XToys script drive this player - play, pause, seek and skip. Off by
      default: anyone with access to the XToys session can then control playback,
      which is the point for a remote session but should be a deliberate choice.
      Requires "Script can send outbound messages" on the webhook connection.
    type: BOOLEAN
  statusMs:
    displayName: Status Interval (ms)
    description: >-
      How often to publish player status - title, position, duration and whether
      it is playing - so an XToys script can display it. Default 1000. Set to 0
      to publish nothing.
    type: NUMBER
  axes:
    displayName: Axes To Route
    description: >-
      Comma-separated axes to forward, e.g. "roll, pitch" or "R1, R2". Leave
      blank to forward every auxiliary axis found in the script. The stroke axis
      (L0, sent as the channel "MAIN") is never forwarded - the Handy plays it.
      Name it here as "MAIN", "stroke" or "L0"; all three select it.
    type: STRING
  lookaheadMs:
    displayName: Lookahead (ms)
    description: >-
      How far ahead of the playhead each message reaches. Every frame carries
      the upcoming funscript points for each channel as "position:duration"
      pairs, and the XToys side schedules them - so this is the buffer that
      rides out an unstable connection. Longer buffers better and sends fewer
      messages; shorter discards less work on a seek. Default 2000.
    type: NUMBER
  updateHz:
    displayName: Update Rate (Hz)
    description: >-
      How often to sample the script and send to XToys. Default 10. Keep this at
      or below the Max Message Frequency configured on the XToys side.
    type: NUMBER
  offsetMs:
    displayName: Axis Offset (ms)
    description: >-
      Timing offset applied to the auxiliary axes only. Defaults to the global
      Funscript Offset from Settings > Interface.
    type: NUMBER
